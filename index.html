<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Coconut Cove</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0b2233; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    /* subtle photographic vignette */
    #vignette {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 62%, rgba(8, 16, 24, 0.28) 100%);
    }

    #overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: rgba(6, 20, 30, 0.55); backdrop-filter: blur(10px);
      color: #f2ede2; text-align: center;
      font-family: Georgia, 'Times New Roman', serif;
      transition: opacity 0.7s ease; z-index: 10;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    #overlay h1 { font-size: clamp(34px, 6vw, 58px); font-weight: normal; letter-spacing: 0.06em; }
    #overlay p.sub { font-style: italic; opacity: 0.75; margin-top: -8px; }
    #enter {
      font: inherit; font-size: 18px; letter-spacing: 0.14em;
      padding: 13px 42px; margin-top: 12px; cursor: pointer;
      color: #f2ede2; background: rgba(255, 235, 200, 0.12);
      border: 1px solid rgba(242, 237, 226, 0.55); border-radius: 999px;
      transition: background 0.25s;
    }
    #enter:hover { background: rgba(255, 235, 200, 0.28); }
    #enterTouch {
      font: inherit; font-size: 14px; letter-spacing: 0.1em;
      padding: 9px 28px; cursor: pointer;
      color: #f2ede2; background: transparent;
      border: 1px solid rgba(242, 237, 226, 0.35); border-radius: 999px;
      transition: background 0.25s;
    }
    #enterTouch:hover { background: rgba(255, 235, 200, 0.15); }
    #seedRow {
      margin-top: 14px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
      opacity: 0.65;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      user-select: none;
    }
    #seedRow input {
      appearance: none;
      -webkit-appearance: none;
      width: 34px;
      height: 19px;
      border-radius: 10px;
      background: rgba(255, 245, 225, 0.14);
      border: 1px solid rgba(255, 245, 225, 0.4);
      position: relative;
      cursor: pointer;
      margin: 0;
      transition: background 0.25s;
    }
    #seedRow input::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: rgba(255, 245, 225, 0.7);
      transition: transform 0.25s, background 0.25s;
    }
    #seedRow input:checked { background: rgba(216, 201, 163, 0.55); }
    #seedRow input:checked::after { transform: translateX(15px); background: #fff8e8; }
    #seedTag {
      margin-top: 8px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      opacity: 0.4;
      letter-spacing: 0.08em;
    }
    #credit {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
      color: inherit;
      text-decoration: none;
      opacity: 0.55;
      transition: opacity 0.2s;
    }
    #credit:hover { opacity: 1; }
    #credit svg { display: block; }

    /* regenerate-the-island button (above the title overlay, always reachable) */
    #regen {
      position: fixed; left: 14px; top: 12px; z-index: 20;
      display: inline-flex; align-items: center; gap: 8px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px; letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(10, 25, 35, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      padding: 8px 15px 8px 12px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.25s;
      -webkit-user-select: none; user-select: none;
    }
    #regen:hover { background: rgba(255, 235, 200, 0.26); }
    #regen .glyph { font-size: 14px; line-height: 1; }
    #regen.spun .glyph { animation: regenSpin 0.5s ease-out; }
    @keyframes regenSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* on-screen touch controls */
    #touchui { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
    #touchui.hidden { display: none; }
    #joy {
      position: absolute;
      left: calc(24px + env(safe-area-inset-left));
      bottom: calc(24px + env(safe-area-inset-bottom));
      width: 132px; height: 132px; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.38);
      background: rgba(10, 25, 35, 0.28);
      backdrop-filter: blur(4px);
      pointer-events: auto; touch-action: none;
    }
    #knob {
      position: absolute; left: 50%; top: 50%;
      width: 56px; height: 56px; margin: -28px 0 0 -28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }
    #jumpBtn {
      position: absolute;
      right: calc(28px + env(safe-area-inset-right));
      bottom: calc(40px + env(safe-area-inset-bottom));
      width: 88px; height: 88px; border-radius: 50%;
      font-size: 15px; letter-spacing: 0.12em;
      font-family: ui-monospace, Menlo, monospace;
      color: #fff; border: 2px solid rgba(255, 255, 255, 0.4);
      background: rgba(10, 25, 35, 0.32);
      backdrop-filter: blur(4px);
      pointer-events: auto; touch-action: none;
      -webkit-user-select: none; user-select: none;
    }
    #jumpBtn.pressed { background: rgba(255, 255, 255, 0.38); }
    #controls {
      display: flex; gap: 22px; flex-wrap: wrap; justify-content: center;
      font-family: ui-monospace, Menlo, monospace; font-size: 12.5px;
      opacity: 0.72; margin-top: 14px; max-width: 560px;
    }
    #controls span b {
      border: 1px solid rgba(242, 237, 226, 0.4); border-radius: 5px;
      padding: 2px 7px; margin-right: 6px; font-weight: normal;
    }
    #hud {
      position: fixed; right: 14px; bottom: 12px; z-index: 5;
      display: flex; gap: 10px; align-items: center;
      font-family: ui-monospace, Menlo, monospace; font-size: 12px;
      color: rgba(255, 255, 255, 0.75);
    }
    #mute {
      font-size: 17px; background: rgba(10, 25, 35, 0.4); color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 8px;
      width: 38px; height: 34px; cursor: pointer;
    }
    #loading { font-family: ui-monospace, Menlo, monospace; font-size: 13px; opacity: 0.6; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="vignette"></div>

  <button id="regen" title="grow a brand-new island (the seed goes in the URL)">
    <span class="glyph">⟳</span>new island
  </button>

  <div id="overlay">
    <h1>🌴 Coconut Cove</h1>
    <p class="sub">a tiny island, grown entirely from code</p>
    <button id="enter">walk the beach</button>
    <div id="controls">
      <span><b>W A S D</b>walk</span>
      <span><b>mouse</b>look</span>
      <span><b>shift</b>run</span>
      <span><b>space</b>jump</span>
      <span><b>M</b>sound</span>
    </div>
    <button id="enterTouch">📱 touch / mobile controls</button>
    <label id="seedRow"><input type="checkbox" id="seedToggle"> use a random island seed</label>
    <div id="seedTag">island #0</div>
    <a id="credit" href="https://github.com/cyrus2281/coconut-cove" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      created by Cyrus Mobini
    </a>
  </div>

  <div id="hud">
    <button id="mute" title="toggle ocean sound (M)">🔊</button>
  </div>

  <div id="touchui" class="hidden">
    <div id="joy"><div id="knob"></div></div>
    <button id="jumpBtn">JUMP</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
