<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coconut Cove · component viewer</title>
  <meta name="robots" content="noindex" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0b2233; }
    body {
      font-family: ui-monospace, Menlo, monospace;
      color: #e8e4d8;
      display: flex;
    }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    /* ---- left rail: the component list ---- */
    #rail {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 10;
      width: 208px; overflow-y: auto;
      background: rgba(7, 22, 32, 0.82);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      padding: 14px 12px 20px;
    }
    #rail h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: normal; font-size: 19px; letter-spacing: 0.04em;
      margin-bottom: 2px;
    }
    #rail .sub {
      font-size: 10.5px; opacity: 0.5; letter-spacing: 0.06em;
      margin-bottom: 12px; display: block;
    }
    #rail .section {
      font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
      opacity: 0.45; margin: 14px 4px 6px;
    }
    #rail button.creature {
      display: block; width: 100%; text-align: left;
      font: inherit; font-size: 12.5px; letter-spacing: 0.04em;
      color: #e8e4d8; cursor: pointer;
      background: transparent; border: 1px solid transparent;
      border-radius: 8px; padding: 6px 10px; margin-bottom: 2px;
      transition: background 0.15s;
    }
    #rail button.creature:hover { background: rgba(255, 235, 200, 0.12); }
    #rail button.creature.active {
      background: rgba(255, 235, 200, 0.16);
      border-color: rgba(242, 237, 226, 0.35);
    }
    #rail a.back {
      color: inherit; opacity: 0.55; font-size: 11px; text-decoration: none;
      display: inline-block; margin-top: 16px;
    }
    #rail a.back:hover { opacity: 1; }

    /* ---- top bar: animations + environment ---- */
    #topbar {
      position: fixed; left: 224px; right: 14px; top: 12px; z-index: 10;
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      pointer-events: none;
    }
    #topbar > * { pointer-events: auto; }
    .chipRow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .chipLabel { font-size: 10px; letter-spacing: 0.14em; opacity: 0.5; margin-right: 2px; }
    button.chip {
      font: inherit; font-size: 12px; letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.88); cursor: pointer;
      background: rgba(10, 25, 35, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px; padding: 6px 13px;
      backdrop-filter: blur(5px);
      transition: background 0.15s;
      -webkit-user-select: none; user-select: none;
    }
    button.chip:hover { background: rgba(255, 235, 200, 0.2); }
    button.chip.on {
      background: rgba(255, 235, 200, 0.26);
      border-color: rgba(255, 235, 200, 0.65);
      color: #fff;
    }
    .gap { width: 10px; }

    /* ---- bottom-right: toggles + stats ---- */
    #hud {
      position: fixed; right: 14px; bottom: 12px; z-index: 10;
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
      font-size: 11.5px;
    }
    #hud .row { display: flex; gap: 6px; align-items: center; }
    #stats {
      background: rgba(7, 22, 32, 0.6); border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px; padding: 6px 10px; opacity: 0.85;
      text-align: right; line-height: 1.5; backdrop-filter: blur(5px);
    }
    #speedWrap {
      display: flex; align-items: center; gap: 8px;
      background: rgba(7, 22, 32, 0.6); border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px; padding: 5px 12px; backdrop-filter: blur(5px);
    }
    #speed { width: 110px; accent-color: #e8d8b0; }

    /* ---- bottom-left hint ---- */
    #hint {
      position: fixed; left: 224px; bottom: 12px; z-index: 10;
      font-size: 11px; opacity: 0.45; letter-spacing: 0.05em;
    }
    /* ---- audio section: no stage, no specimen, just the track ---- */
    body.audio-mode #stage,
    body.audio-mode #envRow,
    body.audio-mode #hud,
    body.audio-mode #hint { display: none; }

    #audioPanel { display: none; }
    body.audio-mode #audioPanel {
      position: fixed; left: 224px; right: 14px; top: 0; bottom: 0; z-index: 5;
      display: flex; flex-direction: column; justify-content: center;
      gap: 15px; max-width: 660px; padding-right: 8px;
    }
    #audioPanel h2 {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: normal; font-size: 26px; letter-spacing: 0.02em;
      margin-bottom: 9px;
    }
    #apBlurb { font-size: 12.5px; line-height: 1.75; opacity: 0.62; max-width: 58ch; }
    #apMeter {
      width: 100%; height: 146px; display: block;
      background: rgba(7, 22, 32, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
    }
    .apRow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    #apPlay { min-width: 96px; text-align: center; }
    #apReadout { font-size: 11px; opacity: 0.55; letter-spacing: 0.04em; }
    #apSpec {
      font-size: 11px; letter-spacing: 0.04em; opacity: 0.5; line-height: 1.7;
      border-left: 1px solid rgba(255, 255, 255, 0.18); padding-left: 11px;
    }
    #apVol { width: 118px; accent-color: #e8d8b0; }

    @media (max-width: 760px) {
      #rail { width: 160px; }
      #topbar, #hint { left: 172px; }
      body.audio-mode #audioPanel { left: 172px; }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <nav id="rail">
    <h1>component viewer</h1>
    <span class="sub">every piece of the island, one at a time</span>
    <div id="list"></div>
    <a class="back" href="/">&larr; back to the island</a>
  </nav>

  <div id="topbar">
    <div class="chipRow" id="animRow"><span class="chipLabel">POSE</span></div>
    <div class="gap"></div>
    <div class="chipRow" id="envRow">
      <span class="chipLabel">SCENE</span>
      <button class="chip" data-env="beach">beach</button>
      <button class="chip" data-env="water">underwater</button>
      <button class="chip" id="nightBtn">night</button>
    </div>
  </div>

  <div id="hud">
    <div class="row">
      <button class="chip" id="turnBtn">turntable</button>
      <button class="chip" id="wireBtn">wireframe</button>
      <button class="chip" id="gridBtn">grid</button>
      <button class="chip" id="rerollBtn" title="rebuild this component with a fresh seed">reroll</button>
    </div>
    <div class="row" id="speedWrap">
      <span>speed</span>
      <input id="speed" type="range" min="0" max="2" step="0.05" value="1" />
      <span id="speedVal">1.0x</span>
    </div>
    <div id="stats">&nbsp;</div>
  </div>

  <div id="hint">drag orbits · wheel zooms · right drag pans</div>

  <!-- the audio section swaps the stage for a track and its controls -->
  <section id="audioPanel">
    <div>
      <h2 id="apName">&nbsp;</h2>
      <p id="apBlurb"></p>
    </div>
    <canvas id="apMeter"></canvas>
    <div class="apRow">
      <button class="chip" id="apPlay">play</button>
      <span id="apReadout"></span>
    </div>
    <div id="apSpec"></div>
    <div class="apRow">
      <span class="chipLabel">VOLUME</span>
      <input id="apVol" type="range" min="0" max="1" step="0.01" value="0.4" />
      <span id="apVolVal">0.40</span>
    </div>
  </section>

  <script type="module" src="/src/viewer/main.js"></script>
</body>
</html>
